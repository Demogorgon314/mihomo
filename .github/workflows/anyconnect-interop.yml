name: AnyConnect Interop

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/anyconnect-interop.yml"
      - "adapter/outbound/anyconnect*.go"
      - "adapter/parser.go"
      - "constant/adapters.go"
      - "internal/testutil/anyconnect/**"
      - "transport/anyconnect/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

jobs:
  hermetic-and-ocserv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      MIHOMO_ANYCONNECT_OCSERV: 1
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: "1.25"

      - name: Check out pinned sing-openconnect fork
        uses: actions/checkout@v6
        with:
          repository: Demogorgon314/sing-openconnect
          ref: 7367b1d2bdedf234cc9435d85bfc0c8f847a0156
          path: .anyconnect-upstream

      - name: Verify hermetic harness
        env:
          MIHOMO_ANYCONNECT_MATRIX: ${{ github.workspace }}/artifacts/hermetic-capabilities.json
        run: go test ./internal/testutil/anyconnect -count=20

      - name: Verify hermetic harness with gVisor
        env:
          MIHOMO_ANYCONNECT_MATRIX: ${{ github.workspace }}/artifacts/gvisor-capabilities.json
        run: go test -tags=with_gvisor ./transport/anyconnect ./adapter/outbound ./internal/testutil/anyconnect -count=1

      - name: Verify AnyConnect lifecycle under race detector
        run: go test -race -tags=with_gvisor ./transport/anyconnect ./adapter/outbound ./internal/testutil/anyconnect -count=1

      - name: Enforce AnyConnect coverage floor
        run: |
          go test -tags=with_gvisor -coverprofile=/tmp/anyconnect-transport.cover ./transport/anyconnect
          go test -tags=with_gvisor -coverprofile=/tmp/anyconnect-outbound.cover ./adapter/outbound
          go test -tags=with_gvisor -coverpkg=github.com/metacubex/mihomo/adapter/outbound -coverprofile=/tmp/anyconnect-parser.cover ./adapter
          go tool cover -func=/tmp/anyconnect-transport.cover | awk '/^total:/ { value=$3; sub(/%/, "", value); printf "transport/anyconnect coverage: %.1f%%\n", value; if (value < 80) exit 1 }'
          awk 'FNR > 1 { statements[$1]=$2; if ($3 > counts[$1]) counts[$1]=$3 } END { for (block in statements) if (block ~ /adapter\/outbound\/anyconnect(_session)?\.go:/) { total+=statements[block]; if (counts[block] > 0) covered+=statements[block] } value=100*covered/total; printf "AnyConnect adapter coverage: %.1f%%\n", value; if (value < 80) exit 1 }' /tmp/anyconnect-outbound.cover /tmp/anyconnect-parser.cover

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Verify pinned ocserv fixture
        env:
          MIHOMO_ANYCONNECT_MATRIX: ${{ github.workspace }}/artifacts/ocserv-capabilities.json
        run: go test -tags=anyconnect_ocserv,with_gvisor ./internal/testutil/anyconnect -run '^TestOCServFixture$' -count=1 -v

      - name: Verify full upstream ocserv matrix
        working-directory: .anyconnect-upstream/test
        run: go test ./... -count=1 -timeout=15m

      - name: Upload capability matrices
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anyconnect-capability-matrices
          path: artifacts/*.json
          if-no-files-found: error

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      FUZZ_TIME: ${{ github.event_name == 'schedule' && '2m' || startsWith(github.ref, 'refs/tags/') && '1m' || '10s' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: "1.25"

      - name: Check out pinned sing-openconnect fork
        uses: actions/checkout@v6
        with:
          repository: Demogorgon314/sing-openconnect
          ref: 7367b1d2bdedf234cc9435d85bfc0c8f847a0156
          path: .anyconnect-upstream

      - name: Restore accumulated fuzz corpus
        uses: actions/cache@v5
        with:
          path: ~/.cache/go-build/fuzz
          key: anyconnect-fuzz-${{ runner.os }}-${{ hashFiles('go.sum', 'adapter/outbound/anyconnect_generation_test.go', '.anyconnect-upstream/go.sum', '.anyconnect-upstream/anyconnect_parser_fuzz_test.go') }}-${{ github.run_id }}
          restore-keys: |
            anyconnect-fuzz-${{ runner.os }}-${{ hashFiles('go.sum', 'adapter/outbound/anyconnect_generation_test.go', '.anyconnect-upstream/go.sum', '.anyconnect-upstream/anyconnect_parser_fuzz_test.go') }}-
            anyconnect-fuzz-${{ runner.os }}-

      - name: Fuzz protocol parsers
        working-directory: .anyconnect-upstream
        run: |
          go test -run '^$' -fuzz '^FuzzCSTPPacketParser$' -fuzztime="$FUZZ_TIME"
          go test -run '^$' -fuzz '^FuzzAnyConnectAuthenticationXML$' -fuzztime="$FUZZ_TIME"
          go test -run '^$' -fuzz '^FuzzAnyConnectStatelessCompression$' -fuzztime="$FUZZ_TIME"
          go test -run '^$' -fuzz '^FuzzLegacyDTLSRecordParser$' -fuzztime="$FUZZ_TIME"

      - name: Fuzz mihomo packet boundary
        run: go test -tags=with_gvisor ./adapter/outbound -run '^$' -fuzz '^FuzzAnyConnectPacketBoundary$' -fuzztime="$FUZZ_TIME"

      - name: Upload failing fuzz corpus
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: anyconnect-fuzz-failures
          path: |
            .anyconnect-upstream/testdata/fuzz/**
            adapter/outbound/testdata/fuzz/**
          if-no-files-found: ignore

  cstp-soak:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      MIHOMO_ANYCONNECT_SOAK: 1
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: "1.25"

      - name: Run CSTP release soak
        run: go test -tags=with_gvisor ./adapter/outbound -run '^TestAnyConnectCSTPSoak$' -count=1 -timeout=7m

  legacy-dtls-soak:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      MIHOMO_ANYCONNECT_SOAK: 1
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: "1.25"

      - name: Run legacy DTLS release soak
        run: go test -tags=with_gvisor ./adapter/outbound -run '^TestAnyConnectLegacyDTLSSoak$' -count=1 -timeout=7m

  modern-dtls-soak:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      MIHOMO_ANYCONNECT_SOAK: 1
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: "1.25"

      - name: Run modern DTLS release soak
        run: go test -tags=with_gvisor ./adapter/outbound -run '^TestAnyConnectModernDTLSSoak$' -count=1 -timeout=7m

  release-stress:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      MIHOMO_ANYCONNECT_STRESS: 1
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: "1.25"

      - name: Run AnyConnect release stress
        run: go test -tags=with_gvisor ./adapter/outbound -run '^TestAnyConnectReleaseStress$' -count=1 -timeout=5m
